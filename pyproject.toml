# pyproject.toml — single source of truth do projeto (deps, linting, pytest).
# A estrutura de engenharia (pacote churn, API, testes, ruff) entra na Etapa 3.

[tool.poetry]
name = "churn-mlp"
version = "0.1.0"
description = "Previsão de churn em telecom — Tech Challenge Fase 01 (FIAP ML Eng)"
authors = ["Alessandro Stefani <stefani.alessandro@gmail.com>"]
readme = "README.md"
packages = [{ include = "churn", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
scikit-learn = "^1.5"
matplotlib = "^3.9"
seaborn = "^0.13"
mlflow = "^2.16"
jupyterlab = "^4.2"
ipykernel = "^6.29"
joblib = "^1.5"
fastapi = "^0.138"
uvicorn = { version = "^0.49", extras = ["standard"] }
pydantic = "^2.13"
pandera = ">=0.20,<1.0"
torch = [
  {version = "2.7.1+cu128", source = "pytorch-cu128", markers = "sys_platform == 'linux'"},
  {version = "2.7.1",                                 markers = "sys_platform == 'darwin'"},
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = ">=0.6"
httpx = "^0.28"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, ordenação de imports

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
